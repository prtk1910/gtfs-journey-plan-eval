[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gtfs-journey-plan-eval"
version = "0.1.0"
description = "Zero-shot LLM transit journey planning vs exact RAPTOR gold on real GTFS feeds"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.0",
    "requests>=2.31",
    "jsonschema>=4.20",
    "matplotlib>=3.8",
    "python-docx>=1.1",
]

[tool.setuptools.packages.find]
where = ["src"]
